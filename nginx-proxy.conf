# ============================================================================
# nginx-proxy 反代配置 (备份 / 部署同步用)
# ----------------------------------------------------------------------------
# 这个文件是 homelab 中央反代 nginx-proxy 容器的 /etc/nginx/conf.d/index.home.conf
# 的本地副本。容器名 nginx-proxy,镜像 nginx:alpine,监听 0.0.0.0:80。
#
# 当前路由表:
#   /          → 192.168.31.31:3002  (AI Nav, apps/api, Docker compose)
#   /gitea/    → 192.168.31.31:3000  (Gitea)
#   /tesla/    → 192.168.31.31:4000  (TeslaMate)
#
# 注: Lexicon (Next.js SPA, 192.168.31.31:4001) 因打包时未设置 basePath,
#     所有 asset 路径都是根路径,反代到子路径会破 CSS / 客户端路由。
#     故不在 nginx-proxy 中反代,改用直连 http://192.168.31.31:4001/ 访问。
#
# 如何应用修改:
#   1. 编辑本文件
#   2. 推到容器:
#        docker exec -i nginx-proxy tee /etc/nginx/conf.d/index.home.conf \
#          < nginx-proxy.conf
#   3. 测试语法并 reload:
#        docker exec nginx-proxy nginx -t
#        docker exec nginx-proxy nginx -s reload
#
# 重要提醒:
#   - proxy_pass 末尾的 / 决定是否剥离前缀 (有 / 剥离,无 / 保留)
#   - 反代 4001/websocket 类应用记得保留 WebSocket 头部
#   - 加新应用:复制任意一个 location 块,改 path 和 proxy_pass 即可
# ============================================================================

# HTTP 访问配置（禁用 SSL）
server {
    listen 80;
    server_name muzig.home 192.168.31.31 localhost _;

    # AI Nav (主入口)
    # 使用 host.docker.internal 指向宿主机,避免宿主机 LAN IP 漂移 / 跨机部署时失联。
    location / {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gitea
    location /gitea/ {
        proxy_pass http://192.168.31.31:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /gitea;
    }

    # TeslaMate
    location /tesla/ {
        proxy_pass http://192.168.31.31:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tesla;
    }
}
